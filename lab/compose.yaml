name: incident-agent-lab
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: incident
      POSTGRES_DB: incident_lab
      POSTGRES_PASSWORD: ${INCIDENT_LAB_PG_PASSWORD:?Run scripts/incident-lab.py}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - incident-lab-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident_lab"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 384m
volumes:
  incident-lab-pg:
